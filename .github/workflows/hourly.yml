name: 매시 정각 알림
on:
  # 깃허브 자체 예약 실행은 시각이 들쑥날쑥해서 껐음 (2026-10-19). 외부 타이머(cron-job.org)가 매시 00분에 직접 실행시킴
  workflow_dispatch:
    inputs:
      force:
        description: '시간대와 상관없이 지금 바로 보내기 (시험용)'
        type: boolean
        default: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node push/send.js
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_CODES: ${{ secrets.PUSH_CODES }}
          BACKUP_READ_TOKEN: ${{ secrets.BACKUP_READ_TOKEN }}
          BACKUP_REPO: taichen2k/candoit-backup
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
